<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1000" viewBox="0 0 1660 1000" font-family="Inter, 'DejaVu Sans', sans-serif" font-style="normal">
<rect width="1660" height="1000" fill="#ffffff"/>
<text x="40" y="58" font-size="26" font-weight="700" fill="#212529">Онлайн-чаевые — схема системы</text>
<text x="40" y="84" font-size="14" fill="#6c757d">кейс 3 · блоки, потоки данных и их содержимое</text>
<rect x="40" y="110" width="240" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="54" y="138" font-size="17" font-weight="700" fill="#868e96">Клиент</text>
<text x="54" y="164" font-size="13.5" fill="#343a40" xml:space="preserve">телефон, браузер</text>
<text x="54" y="183" font-size="13.5" fill="#343a40" xml:space="preserve">сканирует QR,</text>
<text x="54" y="202" font-size="13.5" fill="#343a40" xml:space="preserve">выбирает чаевые</text>
<rect x="40" y="300" width="240" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="54" y="328" font-size="17" font-weight="700" fill="#868e96">Официант / мерчант</text>
<text x="54" y="354" font-size="13.5" fill="#343a40" xml:space="preserve">кабинет: QR на чек,</text>
<text x="54" y="373" font-size="13.5" fill="#343a40" xml:space="preserve">свои чаевые, отчёты</text>
<rect x="40" y="490" width="240" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="54" y="518" font-size="17" font-weight="700" fill="#868e96">Касса (POS)</text>
<text x="54" y="544" font-size="13.5" fill="#343a40" xml:space="preserve">реестр чеков:</text>
<text x="54" y="563" font-size="13.5" fill="#343a40" xml:space="preserve">receipt_id, сумма</text>
<rect x="40" y="680" width="240" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="54" y="708" font-size="17" font-weight="700" fill="#868e96">Администратор</text>
<text x="54" y="734" font-size="13.5" fill="#343a40" xml:space="preserve">активация и блокировка</text>
<text x="54" y="753" font-size="13.5" fill="#343a40" xml:space="preserve">мерчантов, справочники</text>
<rect x="440" y="110" width="240" height="700" rx="10" fill="#e7f0fb" stroke="#3b6fb6" stroke-width="2.5"/>
<text x="454" y="138" font-size="17" font-weight="700" fill="#3b6fb6">API платформы</text>
<text x="454" y="164" font-size="13.5" fill="#343a40" xml:space="preserve">HTTPS (TLS)</text>
<text x="454" y="183" font-size="13.5" fill="#343a40" xml:space="preserve">аутентификация (JWT)</text>
<text x="454" y="202" font-size="13.5" fill="#343a40" xml:space="preserve">RBAC: 4 роли</text>
<text x="454" y="221" font-size="13.5" fill="#343a40" xml:space="preserve">rate limit → 429</text>
<text x="454" y="240" font-size="13.5" fill="#343a40" xml:space="preserve">формат запроса → 400</text>
<text x="454" y="259" font-size="13.5" fill="#343a40" xml:space="preserve">маскирование логов</text>
<text x="454" y="278" font-size="13.5" fill="#343a40" xml:space="preserve"></text>
<text x="454" y="297" font-size="13.5" fill="#343a40" xml:space="preserve">/api/v1/qr</text>
<text x="454" y="316" font-size="13.5" fill="#343a40" xml:space="preserve">/api/v1/tips</text>
<text x="454" y="335" font-size="13.5" fill="#343a40" xml:space="preserve">/api/v1/payments/{id}/</text>
<text x="454" y="354" font-size="13.5" fill="#343a40" xml:space="preserve">    confirm · cancel</text>
<text x="454" y="373" font-size="13.5" fill="#343a40" xml:space="preserve">/api/v1/reports/tips</text>
<rect x="780" y="110" width="460" height="470" rx="10" fill="#f2f8f2" stroke="#3d8b4f" stroke-width="2.5"/>
<text x="794" y="138" font-size="17" font-weight="700" fill="#3d8b4f">Сервис чаевых — бизнес-логика</text>
<rect x="800" y="160" width="420" height="110" rx="10" fill="#ffffff" stroke="#3d8b4f" stroke-width="1.5"/>
<text x="814" y="188" font-size="17" font-weight="700" fill="#3d8b4f">QR-модуль</text>
<text x="814" y="214" font-size="13.5" fill="#343a40" xml:space="preserve">генерация: nonce, exp ≤ 24 ч, HMAC-SHA256</text>
<text x="814" y="233" font-size="13.5" fill="#343a40" xml:space="preserve">проверка: подпись → exp → nonce → мерчант → чек</text>
<rect x="800" y="290" width="420" height="140" rx="10" fill="#ffffff" stroke="#3d8b4f" stroke-width="1.5"/>
<text x="814" y="318" font-size="17" font-weight="700" fill="#3d8b4f">Платёжный модуль</text>
<text x="814" y="344" font-size="13.5" fill="#343a40" xml:space="preserve">сумма из реестра чеков, расчёт в Decimal</text>
<text x="814" y="363" font-size="13.5" fill="#343a40" xml:space="preserve">лимиты P-1, Q-6, P-3</text>
<text x="814" y="382" font-size="13.5" fill="#343a40" xml:space="preserve">идемпотентность P-2, блокировка QR</text>
<text x="814" y="401" font-size="13.5" fill="#343a40" xml:space="preserve">CREATED → PENDING → SUCCESS / DECLINED</text>
<rect x="800" y="450" width="200" height="110" rx="10" fill="#ffffff" stroke="#3d8b4f" stroke-width="1.5"/>
<text x="814" y="478" font-size="17" font-weight="700" fill="#3d8b4f">Отчёты</text>
<text x="814" y="504" font-size="13.5" fill="#343a40" xml:space="preserve">мерчант · официант · день</text>
<text x="814" y="523" font-size="13.5" fill="#343a40" xml:space="preserve">чаевые: только SUCCESS</text>
<rect x="1020" y="450" width="200" height="110" rx="10" fill="#ffffff" stroke="#3d8b4f" stroke-width="1.5"/>
<text x="1034" y="478" font-size="17" font-weight="700" fill="#3d8b4f">Сверка (job)</text>
<text x="1034" y="504" font-size="13.5" fill="#343a40" xml:space="preserve">PENDING &gt; 15 мин →</text>
<text x="1034" y="523" font-size="13.5" fill="#343a40" xml:space="preserve">DECLINED,</text>
<text x="1034" y="542" font-size="13.5" fill="#343a40" xml:space="preserve">GATEWAY_TIMEOUT</text>
<rect x="1360" y="160" width="260" height="110" rx="10" fill="#fff9db" stroke="#b0901a" stroke-width="1.5"/>
<text x="1374" y="188" font-size="17" font-weight="700" fill="#b0901a">Секреты</text>
<text x="1374" y="214" font-size="13.5" fill="#343a40" xml:space="preserve">env: TIPS_HMAC_SECRET,</text>
<text x="1374" y="233" font-size="13.5" fill="#343a40" xml:space="preserve">пароль БД;</text>
<text x="1374" y="252" font-size="13.5" fill="#343a40" xml:space="preserve">не в Git и не в логах</text>
<rect x="1360" y="290" width="260" height="140" rx="10" fill="#fff3e3" stroke="#d9822b" stroke-width="1.5"/>
<text x="1374" y="318" font-size="17" font-weight="700" fill="#d9822b">Эмулятор шлюза</text>
<text x="1374" y="344" font-size="13.5" fill="#343a40" xml:space="preserve">1) gateway_scenarios.csv</text>
<text x="1374" y="363" font-size="13.5" fill="#343a40" xml:space="preserve">2) h = md5(qr_id + nonce) mod 10</text>
<text x="1374" y="382" font-size="13.5" fill="#343a40" xml:space="preserve">0–7 SUCCESS · 8 DECLINED</text>
<text x="1374" y="401" font-size="13.5" fill="#343a40" xml:space="preserve">9 TIMEOUT</text>
<rect x="780" y="660" width="460" height="170" rx="10" fill="#f3effa" stroke="#7048a8" stroke-width="1.5"/>
<text x="794" y="688" font-size="17" font-weight="700" fill="#7048a8">Хранилище</text>
<text x="794" y="714" font-size="13.5" fill="#343a40" xml:space="preserve">merchants, employees (реквизиты ****NNNN)</text>
<text x="794" y="733" font-size="13.5" fill="#343a40" xml:space="preserve">receipts, qr_links</text>
<text x="794" y="752" font-size="13.5" fill="#343a40" xml:space="preserve">payments (+ payments_out.csv), idempotency_keys</text>
<text x="794" y="771" font-size="13.5" fill="#343a40" xml:space="preserve">reports — пересчитываемый агрегат</text>
<rect x="1360" y="660" width="260" height="170" rx="10" fill="#fdeeee" stroke="#c0392b" stroke-width="1.5"/>
<text x="1374" y="688" font-size="17" font-weight="700" fill="#c0392b">Аудит</text>
<text x="1374" y="714" font-size="13.5" fill="#343a40" xml:space="preserve">audit_events, только дописывание</text>
<text x="1374" y="733" font-size="13.5" fill="#343a40" xml:space="preserve">событие на каждый переход:</text>
<text x="1374" y="752" font-size="13.5" fill="#343a40" xml:space="preserve">event_id, payment_id, qr_id,</text>
<text x="1374" y="771" font-size="13.5" fill="#343a40" xml:space="preserve">action, from → to, amount_total,</text>
<text x="1374" y="790" font-size="13.5" fill="#343a40" xml:space="preserve">actor, at</text>
<polyline points="280,160 440,160" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="440,160 429.0,164.95 429.0,155.05" fill="#495057"/>
<rect x="294.2" y="100" width="131.5" height="50" fill="#ffffff"/>
<text x="360" y="112" font-size="12.5" text-anchor="middle" fill="#212529">③ GET /qr/{id}?sig=</text>
<text x="360" y="128" font-size="12.5" text-anchor="middle" fill="#212529">④ POST /tips</text>
<text x="360" y="144" font-size="12.5" text-anchor="middle" fill="#212529">⑤ confirm · cancel</text>
<polyline points="440,205 280,205" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="280,205 291.0,200.05 291.0,209.95" fill="#495057"/>
<rect x="287.0" y="212" width="146.0" height="34" fill="#ffffff"/>
<text x="360" y="224" font-size="12.5" text-anchor="middle" fill="#212529">QRResponse · Payment</text>
<text x="360" y="240" font-size="12.5" text-anchor="middle" fill="#212529">Error {code, retryable}</text>
<polyline points="280,350 440,350" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="440,350 429.0,354.95 429.0,345.05" fill="#495057"/>
<rect x="318.6" y="306" width="82.9" height="34" fill="#ffffff"/>
<text x="360" y="318" font-size="12.5" text-anchor="middle" fill="#212529">① POST /qr</text>
<text x="360" y="334" font-size="12.5" text-anchor="middle" fill="#212529">{receipt_id}</text>
<polyline points="440,390 280,390" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="280,390 291.0,385.05 291.0,394.95" fill="#495057"/>
<rect x="291.2" y="397" width="137.5" height="34" fill="#ffffff"/>
<text x="360" y="409" font-size="12.5" text-anchor="middle" fill="#212529">② ссылка ?qr=&amp;sig=</text>
<text x="360" y="425" font-size="12.5" text-anchor="middle" fill="#212529">+ картинка QR</text>
<polyline points="280,555 440,555" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="440,555 429.0,559.95 429.0,550.05" fill="#495057"/>
<rect x="310.2" y="511" width="99.5" height="34" fill="#ffffff"/>
<text x="360" y="523" font-size="12.5" text-anchor="middle" fill="#212529">чек {receipt_id,</text>
<text x="360" y="539" font-size="12.5" text-anchor="middle" fill="#212529">amount}</text>
<polyline points="280,745 440,745" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="440,745 429.0,749.95 429.0,740.05" fill="#495057"/>
<rect x="302.9" y="701" width="114.2" height="34" fill="#ffffff"/>
<text x="360" y="713" font-size="12.5" text-anchor="middle" fill="#212529">статус мерчанта,</text>
<text x="360" y="729" font-size="12.5" text-anchor="middle" fill="#212529">справочники</text>
<polyline points="680,345 780,345" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="780,345 769.0,349.95 769.0,340.05" fill="#495057"/>
<rect x="704.6" y="301" width="50.8" height="34" fill="#ffffff"/>
<text x="730" y="313" font-size="12.5" text-anchor="middle" fill="#212529">запрос</text>
<text x="730" y="329" font-size="12.5" text-anchor="middle" fill="#212529">+ роль</text>
<polyline points="780,385 680,385" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="680,385 691.0,380.05 691.0,389.95" fill="#495057"/>
<rect x="690.1" y="392" width="79.9" height="34" fill="#ffffff"/>
<text x="730" y="404" font-size="12.5" text-anchor="middle" fill="#212529">ответ</text>
<text x="730" y="420" font-size="12.5" text-anchor="middle" fill="#212529">или ошибка</text>
<polyline points="1360,215 1220,215" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="1220,215 1231.0,210.05 1231.0,219.95" fill="#495057"/>
<rect x="1248.2" y="187" width="83.5" height="18" fill="#ffffff"/>
<text x="1290" y="199" font-size="12.5" text-anchor="middle" fill="#212529">HMAC-ключ</text>
<polyline points="1220,335 1360,335" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="1360,335 1349.0,339.95 1349.0,330.05" fill="#495057"/>
<rect x="1239.7" y="291" width="100.7" height="34" fill="#ffffff"/>
<text x="1290" y="303" font-size="12.5" text-anchor="middle" fill="#212529">⑥ payment_id,</text>
<text x="1290" y="319" font-size="12.5" text-anchor="middle" fill="#212529">qr_id, nonce</text>
<polyline points="1360,395 1220,395" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="1220,395 1231.0,390.05 1231.0,399.95" fill="#495057"/>
<rect x="1252.0" y="402" width="96.0" height="50" fill="#ffffff"/>
<text x="1300" y="414" font-size="12.5" text-anchor="middle" fill="#212529">⑦ SUCCESS /</text>
<text x="1300" y="430" font-size="12.5" text-anchor="middle" fill="#212529">DECLINED /</text>
<text x="1300" y="446" font-size="12.5" text-anchor="middle" fill="#212529">TIMEOUT</text>
<polyline points="1220,500 1490,500 1490,430" fill="none" stroke="#495057" stroke-width="1.8" stroke-dasharray="6 4"/>
<polygon points="1490,430 1494.95,441.0 1485.05,441.0" fill="#495057"/>
<rect x="1304.3" y="479" width="101.4" height="18" fill="#ffffff"/>
<text x="1355" y="491" font-size="12.5" text-anchor="middle" fill="#212529">запрос статуса</text>
<polyline points="1010,580 1010,660" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="1010,660 1005.05,649.0 1014.95,649.0" fill="#495057"/>
<rect x="968.1" y="613" width="103.8" height="18" fill="#ffffff"/>
<text x="1020" y="625" font-size="12.5" text-anchor="middle" fill="#212529">чтение / запись</text>
<polyline points="1240,545 1490,545 1490,660" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="1490,660 1485.05,649.0 1494.95,649.0" fill="#495057"/>
<rect x="1293.7" y="554" width="142.5" height="18" fill="#ffffff"/>
<text x="1365" y="566" font-size="12.5" text-anchor="middle" fill="#212529">⑧ событие перехода</text>
<rect x="40" y="870" width="1580" height="100" rx="10" fill="#fafafa" stroke="#ced4da"/>
<text x="58" y="900" font-size="14" fill="#343a40">Основной поток: ① официант запрашивает QR на чек → ② получает ссылку с подписью → ③ клиент открывает её и видит сумму из реестра →</text>
<text x="58" y="926" font-size="14" fill="#343a40">④ создаёт платёж (CREATED) → ⑤ подтверждает (PENDING) → ⑥ запрос в шлюз → ⑦ исход SUCCESS / DECLINED / TIMEOUT → ⑧ событие в аудит.</text>
<text x="58" y="952" font-size="14" fill="#343a40">Прототип: CLI заменяет клиента и API, CSV-файлы — хранилище, emulate_gateway() — шлюз. Оранжевым отмечена эмулируемая внешняя система.</text>
</svg>