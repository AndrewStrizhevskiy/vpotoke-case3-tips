<text x="872" y="520" font-size="13" font-weight="400" fill="#212529">merchant_id</text>
<text x="1110" y="520" font-size="11.5" text-anchor="end" fill="#6c757d">денорм., отчёты</text>
<text x="830" y="542" font-size="10.5" font-weight="700" fill="#3b6fb6">FK</text>
<text x="872" y="542" font-size="13" font-weight="400" fill="#212529">employee_id</text>
<text x="1110" y="542" font-size="11.5" text-anchor="end" fill="#6c757d">денорм., отчёты</text>
<text x="872" y="564" font-size="13" font-weight="400" fill="#212529">amount</text>
<text x="1110" y="564" font-size="11.5" text-anchor="end" fill="#6c757d">0 &lt; x ≤ 1 000 000</text>
<text x="872" y="586" font-size="13" font-weight="400" fill="#212529">tip</text>
<text x="1110" y="586" font-size="11.5" text-anchor="end" fill="#6c757d">0 ≤ x ≤ amount × 0.5</text>
<text x="872" y="608" font-size="13" font-weight="400" fill="#212529">amount_total</text>
<text x="1110" y="608" font-size="11.5" text-anchor="end" fill="#6c757d">amount + tip</text>
<text x="872" y="630" font-size="13" font-weight="400" fill="#212529">status</text>
<text x="1110" y="630" font-size="11.5" text-anchor="end" fill="#6c757d">5 статусов</text>
<text x="830" y="652" font-size="10.5" font-weight="700" fill="#7048a8">UK</text>
<text x="872" y="652" font-size="13" font-weight="400" fill="#212529">idempotency_key</text>
<text x="1110" y="652" font-size="11.5" text-anchor="end" fill="#6c757d">UUID, уник. в qr_id</text>
<text x="872" y="674" font-size="13" font-weight="400" fill="#212529">error_code</text>
<text x="1110" y="674" font-size="11.5" text-anchor="end" fill="#6c757d">необяз.</text>
<text x="872" y="696" font-size="13" font-weight="400" fill="#212529">timestamp</text>
<text x="1110" y="696" font-size="11.5" text-anchor="end" fill="#6c757d">ISO 8601, UTC</text>
<rect x="1200" y="420" width="300" height="246" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<path d="M1200,458 H1500" stroke="#c0392b" stroke-width="1.2"/>
<text x="1212" y="445" font-size="16" font-weight="700" fill="#c0392b">AuditEvent</text>
<text x="1210" y="476" font-size="10.5" font-weight="700" fill="#b8860b">PK</text>
<text x="1252" y="476" font-size="13" font-weight="700" fill="#212529">event_id</text>
<text x="1490" y="476" font-size="11.5" text-anchor="end" fill="#6c757d">evt_NNNN</text>
<text x="1210" y="498" font-size="10.5" font-weight="700" fill="#3b6fb6">FK</text>
<text x="1252" y="498" font-size="13" font-weight="400" fill="#212529">payment_id</text>
<text x="1490" y="498" font-size="11.5" text-anchor="end" fill="#6c757d">→ Payment</text>
<text x="1210" y="520" font-size="10.5" font-weight="700" fill="#3b6fb6">FK</text>
<text x="1252" y="520" font-size="13" font-weight="400" fill="#212529">qr_id</text>
<text x="1490" y="520" font-size="11.5" text-anchor="end" fill="#6c757d">денорм.</text>
<text x="1252" y="542" font-size="13" font-weight="400" fill="#212529">action</text>
<text x="1490" y="542" font-size="11.5" text-anchor="end" fill="#6c757d">payment_created…</text>
<text x="1252" y="564" font-size="13" font-weight="400" fill="#212529">from_status</text>
<text x="1490" y="564" font-size="11.5" text-anchor="end" fill="#6c757d">статус или null</text>
<text x="1252" y="586" font-size="13" font-weight="400" fill="#212529">to_status</text>
<text x="1490" y="586" font-size="11.5" text-anchor="end" fill="#6c757d">статус</text>
<text x="1252" y="608" font-size="13" font-weight="400" fill="#212529">amount_total</text>
<text x="1490" y="608" font-size="11.5" text-anchor="end" fill="#6c757d">decimal</text>
<text x="1252" y="630" font-size="13" font-weight="400" fill="#212529">actor</text>
<text x="1490" y="630" font-size="11.5" text-anchor="end" fill="#6c757d">client / system / officer</text>
<text x="1252" y="652" font-size="13" font-weight="400" fill="#212529">at</text>
<text x="1490" y="652" font-size="11.5" text-anchor="end" fill="#6c757d">ISO 8601, UTC</text>
<rect x="40" y="760" width="1480" height="100" rx="10" fill="#fafafa" stroke="#ced4da"/>
<text x="58" y="790" font-size="14" fill="#343a40">Связи 1:N. Подписи у концов линий: 1 — сторона «один», N — сторона «много».</text>
<text x="58" y="816" font-size="14" fill="#343a40">Payment.merchant_id / employee_id и AuditEvent.qr_id — денормализация ради отчётов, отдельными линиями не показаны.</text>
<text x="58" y="842" font-size="14" fill="#343a40">Инвариант: QR.merchant_id = Employee.merchant_id = Receipt.merchant_id. Receipt — внешний реестр кассы (пунктир, ADR-003).</text>
</svg>