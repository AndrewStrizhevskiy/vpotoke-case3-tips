<text x="492" y="542" font-size="13" font-weight="400" fill="#212529">receipt_id</text>
<text x="730" y="542" font-size="11.5" text-anchor="end" fill="#6c757d">→ Receipt</text>
<text x="450" y="564" font-size="10.5" font-weight="700" fill="#7048a8">UK</text>
