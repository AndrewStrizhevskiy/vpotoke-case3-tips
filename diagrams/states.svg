<text x="620.0" y="354" font-size="13" text-anchor="middle" fill="#343a40">QR заблокирован</text>
<rect x="960" y="110" width="220" height="90" rx="14" fill="#e6f4ea" stroke="#2f7d43" stroke-width="2"/>
<rect x="965" y="115" width="210" height="80" rx="10" fill="none" stroke="#2f7d43" stroke-width="1.2"/>
<text x="1070.0" y="142" font-size="18" font-weight="700" text-anchor="middle" fill="#2f7d43">SUCCESS</text>
<text x="1070.0" y="166" font-size="13" text-anchor="middle" fill="#343a40">деньги списаны</text>
<text x="1070.0" y="184" font-size="13" text-anchor="middle" fill="#343a40">nonce погашен → QR_USED</text>
<rect x="960" y="420" width="220" height="90" rx="14" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
<rect x="965" y="425" width="210" height="80" rx="10" fill="none" stroke="#c0392b" stroke-width="1.2"/>
<text x="1070.0" y="452" font-size="18" font-weight="700" text-anchor="middle" fill="#c0392b">DECLINED</text>
<text x="1070.0" y="476" font-size="13" text-anchor="middle" fill="#343a40">списания нет</text>
<text x="1070.0" y="494" font-size="13" text-anchor="middle" fill="#343a40">QR свободен до exp</text>
<rect x="520" y="580" width="200" height="90" rx="14" fill="#f1f3f5" stroke="#6c757d" stroke-width="2"/>
<rect x="525" y="585" width="190" height="80" rx="10" fill="none" stroke="#6c757d" stroke-width="1.2"/>
<text x="620.0" y="612" font-size="18" font-weight="700" text-anchor="middle" fill="#6c757d">CANCELED</text>
