<text x="380" y="605" font-size="12.5" text-anchor="middle" fill="#495057">exp / 15 мин без confirm (system)</text>
<polyline points="620,370 620,580" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7 5"/>
<polygon points="620,580 615.05,569.0 624.95,569.0" fill="#c0392b"/>
<circle cx="620.0" cy="475.0" r="11" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
