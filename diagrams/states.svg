<text x="606" y="535" font-size="12.5" text-anchor="end" fill="#c0392b">409</text>
<text x="606" y="551" font-size="12.5" text-anchor="end" fill="#c0392b">CANCEL_NOT_ALLOWED</text>
<polyline points="1180,155 1260,155 1260,650 720,650" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="7 5"/>
<polygon points="720,650 731.0,645.05 731.0,654.95" fill="#c0392b"/>
<circle cx="990.0" cy="650.0" r="11" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<path d="M985.0,645.0 L995.0,655.0 M995.0,645.0 L985.0,655.0" stroke="#c0392b" stroke-width="2"/>
<rect x="819.0" y="614" width="341.9" height="18" fill="#ffffff"/>
<text x="990" y="626" font-size="12.5" text-anchor="middle" fill="#c0392b">409 CANCEL_NOT_ALLOWED: возвратов в проекте нет</text>
<rect x="40" y="690" width="1240" height="310" rx="10" fill="#fafafa" stroke="#ced4da"/>
<text x="60" y="720" font-size="13.5" font-weight="700" fill="#212529">Переход</text>
<text x="260" y="720" font-size="13.5" font-weight="700" fill="#212529">Триггер</text>
<text x="560" y="720" font-size="13.5" font-weight="700" fill="#212529">actor</text>
<text x="690" y="720" font-size="13.5" font-weight="700" fill="#212529">Событие аудита</text>
<text x="900" y="720" font-size="13.5" font-weight="700" fill="#212529">Ответ</text>
<line x1="56" y1="731" x2="1264" y2="731" stroke="#e9ecef"/>
<text x="60" y="750" font-size="13" fill="#343a40">— → CREATED</text>
<text x="260" y="750" font-size="13" fill="#343a40">POST /tips, проверки Q и P пройдены</text>
<text x="560" y="750" font-size="13" fill="#343a40">client</text>
<text x="690" y="750" font-size="13" fill="#343a40">payment_created</text>
<text x="900" y="750" font-size="13" fill="#343a40">201 (повтор ключа: 200)</text>
<line x1="56" y1="759" x2="1264" y2="759" stroke="#e9ecef"/>
<text x="60" y="778" font-size="13" fill="#343a40">CREATED → PENDING</text>
<text x="260" y="778" font-size="13" fill="#343a40">POST /payments/{id}/confirm</text>
<text x="560" y="778" font-size="13" fill="#343a40">client</text>
<text x="690" y="778" font-size="13" fill="#343a40">payment_submitted</text>
<text x="900" y="778" font-size="13" fill="#343a40">—</text>
<line x1="56" y1="787" x2="1264" y2="787" stroke="#e9ecef"/>
<text x="60" y="806" font-size="13" fill="#343a40">PENDING → SUCCESS</text>
<text x="260" y="806" font-size="13" fill="#343a40">эмулятор: h = 0–7</text>
<text x="560" y="806" font-size="13" fill="#343a40">system</text>
<text x="690" y="806" font-size="13" fill="#343a40">payment_confirmed</text>
<text x="900" y="806" font-size="13" fill="#343a40">200</text>
<line x1="56" y1="815" x2="1264" y2="815" stroke="#e9ecef"/>
<text x="60" y="834" font-size="13" fill="#343a40">PENDING → DECLINED</text>
<text x="260" y="834" font-size="13" fill="#343a40">эмулятор: h = 8</text>
<text x="560" y="834" font-size="13" fill="#343a40">system</text>
<text x="690" y="834" font-size="13" fill="#343a40">payment_declined</text>
<text x="900" y="834" font-size="13" fill="#343a40">402 CARD_DECLINED</text>
<line x1="56" y1="843" x2="1264" y2="843" stroke="#e9ecef"/>
<text x="60" y="862" font-size="13" fill="#343a40">PENDING → PENDING</text>
<text x="260" y="862" font-size="13" fill="#343a40">эмулятор: h = 9</text>
<text x="560" y="862" font-size="13" fill="#343a40">system</text>
<text x="690" y="862" font-size="13" fill="#343a40">— (статус не меняется)</text>
<text x="900" y="862" font-size="13" fill="#343a40">202 GATEWAY_TIMEOUT</text>
<line x1="56" y1="871" x2="1264" y2="871" stroke="#e9ecef"/>
<text x="60" y="890" font-size="13" fill="#343a40">PENDING → DECLINED</text>
<text x="260" y="890" font-size="13" fill="#343a40">сверка: 15 мин без ответа</text>
<text x="560" y="890" font-size="13" fill="#343a40">system</text>
<text x="690" y="890" font-size="13" fill="#343a40">payment_declined</text>
<text x="900" y="890" font-size="13" fill="#343a40">— (фоновый процесс)</text>
<line x1="56" y1="899" x2="1264" y2="899" stroke="#e9ecef"/>
<text x="60" y="918" font-size="13" fill="#343a40">CREATED → CANCELED</text>
<text x="260" y="918" font-size="13" fill="#343a40">cancel или истёк exp / 15 мин</text>
<text x="560" y="918" font-size="13" fill="#343a40">client / system</text>
<text x="690" y="918" font-size="13" fill="#343a40">payment_canceled</text>
<text x="900" y="918" font-size="13" fill="#343a40">200</text>
<line x1="56" y1="927" x2="1264" y2="927" stroke="#e9ecef"/>
<text x="60" y="946" font-size="13" fill="#c0392b">PENDING → CANCELED</text>
<text x="260" y="946" font-size="13" fill="#c0392b">cancel</text>
<text x="560" y="946" font-size="13" fill="#c0392b">—</text>
<text x="690" y="946" font-size="13" fill="#c0392b">—</text>
<text x="900" y="946" font-size="13" fill="#c0392b">409 CANCEL_NOT_ALLOWED</text>
<line x1="56" y1="955" x2="1264" y2="955" stroke="#e9ecef"/>
<text x="60" y="974" font-size="13" fill="#c0392b">SUCCESS → CANCELED</text>
<text x="260" y="974" font-size="13" fill="#c0392b">cancel</text>
<text x="560" y="974" font-size="13" fill="#c0392b">—</text>
<text x="690" y="974" font-size="13" fill="#c0392b">—</text>
<text x="900" y="974" font-size="13" fill="#c0392b">409 CANCEL_NOT_ALLOWED</text>
</svg>