<text x="620.0" y="654" font-size="13" text-anchor="middle" fill="#343a40">QR свободен до exp</text>
<polyline points="66,325 140,325" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="140,325 129.0,329.95 129.0,320.05" fill="#495057"/>
<rect x="14.0" y="340" width="91.9" height="18" fill="#ffffff"/>
