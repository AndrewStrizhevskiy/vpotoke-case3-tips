<text x="820" y="528" font-size="12.5" text-anchor="middle" fill="#495057">GATEWAY_TIMEOUT</text>
<polyline points="580,280 580,220 660,220 660,280" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="660,280 655.05,269.0 664.95,269.0" fill="#495057"/>
<rect x="533.3" y="174" width="173.3" height="34" fill="#ffffff"/>
<text x="620" y="186" font-size="12.5" text-anchor="middle" fill="#495057">h = 9: TIMEOUT, ответ 202,</text>
<text x="620" y="202" font-size="12.5" text-anchor="middle" fill="#495057">ждём сверку</text>
