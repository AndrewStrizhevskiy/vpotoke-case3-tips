<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1030" viewBox="0 0 1320 1030" font-family="Inter, 'DejaVu Sans', sans-serif" font-style="normal">
<rect width="1320" height="1030" fill="#ffffff"/>
<text x="40" y="58" font-size="26" font-weight="700" fill="#212529">Жизненный цикл платежа</text>
<text x="40" y="84" font-size="14" fill="#6c757d">кейс 3 · ADR-002 · двойная рамка — финальный статус, красный пунктир — запрещённый переход</text>
<circle cx="56" cy="325" r="10" fill="#212529"/>
<rect x="140" y="280" width="200" height="90" rx="14" fill="#e7f0fb" stroke="#3b6fb6" stroke-width="2"/>
<text x="240.0" y="312" font-size="18" font-weight="700" text-anchor="middle" fill="#3b6fb6">CREATED</text>
<text x="240.0" y="336" font-size="13" text-anchor="middle" fill="#343a40">суммы зафиксированы</text>
<text x="240.0" y="354" font-size="13" text-anchor="middle" fill="#343a40">QR заблокирован</text>
<rect x="520" y="280" width="200" height="90" rx="14" fill="#e7f0fb" stroke="#3b6fb6" stroke-width="2"/>
