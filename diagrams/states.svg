<polyline points="340,325 520,325" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="520,325 509.0,329.95 509.0,320.05" fill="#495057"/>
<rect x="392.8" y="281" width="74.4" height="34" fill="#ffffff"/>
