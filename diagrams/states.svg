<text x="900" y="429" font-size="12.5" text-anchor="middle" fill="#495057">CARD_DECLINED</text>
<polyline points="680,370 680,490 960,490" fill="none" stroke="#495057" stroke-width="1.8"/>
<polygon points="960,490 949.0,494.95 949.0,485.05" fill="#495057"/>
<rect x="734.6" y="500" width="170.8" height="34" fill="#ffffff"/>
