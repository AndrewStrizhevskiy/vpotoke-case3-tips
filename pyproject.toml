[project]
name = "tips"
version = "0.1.0"
description = "Платформа онлайн-чаевых по QR: предметная логика, адаптеры, CLI"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
sql = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "alembic>=1.13"]
http = ["fastapi>=0.110", "uvicorn>=0.29", "PyJWT[crypto]>=2.8", "argon2-cffi>=23.1"]
dev = ["ruff", "pyyaml", "jsonschema", "openapi-spec-validator", "httpx", "tips[sql,http]"]
local-db = ["pgserver"]  # встроенный PostgreSQL для локальных тестов без Docker

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# эталонный сценарий записан плотно, как таблица команд
"tests/golden_cli.py" = ["E401", "E501", "E701", "E702", "E731"]
